name: Deploy Pygame Web

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygbag fonttools

      # pygbag packs the whole folder into the download; drop what the game
      # never loads and shrink the CJK font to the glyphs actually used.
      - name: Slim web bundle
        run: |
          rm -rf assets/generated new_assets scripts/__pycache__
          python scripts/subset_font.py
          rm -rf scripts generate_*.py list_models.py remove_bg.py test_pvp_api.py
          du -sh .

      - name: Build with pygbag
        run: python -m pygbag --build --ume_block 0 .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
